<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
	<link rel="icon" href="%sveltekit.assets%/favicon.png" />

	<!-- Mobile Web App Capable -->
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="theme-color" content="#aa6c39">
	<link rel="manifest" href="%sveltekit.assets%/manifest.json">

	<!-- Google Fonts -->
	<link
		href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;0,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Pinyon+Script&display=swap"
		rel="stylesheet">

	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
